<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Poppins,sans-serif}
.card{background:#16161c;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:40px;width:100%;max-width:380px}
img{width:180px;display:block;margin:0 auto 32px;mix-blend-mode:screen}
h2{font-size:18px;font-weight:600;color:#f0f0f5;margin-bottom:4px;text-align:center}
p{font-size:12px;color:rgba(255,255,255,.4);text-align:center;margin-bottom:28px}
label{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px}
input{width:100%;padding:10px 14px;background:#1e1e26;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#f0f0f5;font-family:Poppins,sans-serif;font-size:13px;outline:none;margin-bottom:16px}
input:focus{border-color:#2a9d8f}
button{width:100%;padding:12px;background:linear-gradient(135deg,#0d4a47,#2a9d8f);border:none;border-radius:8px;color:#fff;font-family:Poppins,sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
button:hover{opacity:.9}
.error{background:rgba(220,60,60,.1);border:1px solid rgba(220,60,60,.3);border-radius:8px;padding:10px 14px;color:#e05555;font-size:12px;margin-bottom:16px}
</style>
