<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Petina · Dashboard ML</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0e0e12;
  --bg2: #16161c;
  --bg3: #1e1e26;
  --bg4: #26262f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f0f5;
  --text2: #9898b0;
  --text3: #5a5a70;

  --grad1: #2ecc9a;
  --grad2: #1ab8a0;
  --grad3: #4a5fe8;
  --grad-start: #2ecc9a;
  --grad-end: #4a5fe8;

  --green: #2ecc9a;
  --green2: rgba(46,204,154,0.12);
  --blue: #4a5fe8;
  --blue2: rgba(74,95,232,0.12);
  --red: #ff5c7a;
  --red2: rgba(255,92,122,0.12);
  --amber: #f5a623;
  --amber2: rgba(245,166,35,0.12);

  --radius: 14px;
  --radius-sm: 9px;
  --radius-xs: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 64px;
  border-bottom: 1px solid var(--border);
  background: rgba(14,14,18,0.95);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}

.logo-wrap {
  display: flex; align-items: center; gap: 14px;
}

.logo-petina {
  display: flex; align-items: center; gap: 8px;
}

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--grad1), var(--grad3));
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif;
  letter-spacing: -1px;
  flex-shrink: 0;
}

.logo-text {
  display: flex; flex-direction: column; line-height: 1.1;
}
.logo-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 15px; font-weight: 700;
  background: linear-gradient(90deg, var(--grad1), var(--grad3));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
}
.logo-sub {
  font-size: 10px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em;
}

.topbar-divider {
  width: 1px; height: 28px;
  background: var(--border2); margin: 0 4px;
}

.topbar-right { display: flex; align-items: center; gap: 10px; }

.period-wrap { display: flex; align-items: center; gap: 8px; }

/* ── PERIOD DROPDOWN ── */
.period-dropdown { position: relative; }

.period-trigger {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: 'Poppins', sans-serif;
  font-size: 13px; font-weight: 500; padding: 8px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: border-color 0.15s; white-space: nowrap;
  min-width: 160px; justify-content: space-between;
}
.period-trigger:hover { border-color: var(--grad1); }
.period-trigger.open { border-color: var(--grad1); }

.period-menu {
  display: none; position: absolute; top: calc(100% + 6px); right: 0;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 6px;
  min-width: 240px; z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.period-menu.open { display: block; }

.period-menu-option {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-xs);
  cursor: pointer; transition: background 0.12s;
}
.period-menu-option:hover { background: var(--bg3); }
.period-menu-option.selected { background: rgba(74,95,232,0.12); border: 1px solid rgba(74,95,232,0.3); }

.period-option-label { font-size: 13px; font-weight: 500; }
.period-option-sub { font-size: 11px; color: var(--text3); }

.period-custom-row {
  display: none; align-items: center; gap: 6px;
  padding: 8px 4px 4px; flex-wrap: wrap;
  border-top: 1px solid var(--border); margin-top: 6px;
}
.period-custom-row.open { display: flex; }

.date-input {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: 'Poppins', sans-serif;
  font-size: 12px; padding: 7px 11px; border-radius: var(--radius-sm);
  outline: none; transition: border-color 0.15s; width: 130px;
}
.date-input:focus { border-color: var(--grad1); }

.btn-apply {
  background: linear-gradient(135deg, var(--grad1), var(--grad3));
  color: #fff; font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 600; padding: 7px 14px;
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  transition: opacity 0.15s;
}
.btn-apply:hover { opacity: 0.88; }

.btn-connect {
  background: linear-gradient(135deg, var(--grad1), var(--grad3));
  color: #fff; font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 600; padding: 8px 16px;
  border: none; border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: opacity 0.15s; white-space: nowrap;
}
.btn-connect:hover { opacity: 0.88; }

/* ── MAIN ── */
.main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

.alert {
  background: var(--green2); border: 1px solid var(--green);
  border-radius: var(--radius-sm); padding: 10px 16px;
  font-size: 13px; color: var(--green); margin-bottom: 20px; display: none;
}

/* ── LIST VIEW ── */
.view { display: none; }
.view.active { display: block; }

.list-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}

.list-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
}
.list-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }

.sellers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

/* ── SELLER CARD ── */
.seller-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.seller-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--grad1), var(--grad3));
  opacity: 0; transition: opacity 0.2s;
}
.seller-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.seller-card:hover::before { opacity: 1; }

.seller-card-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 16px;
}

.seller-card-info { flex: 1; min-width: 0; }

.seller-display-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 16px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}

.seller-display-name-input {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 16px; font-weight: 700;
  background: var(--bg3); border: 1px solid var(--grad1);
  color: var(--text); border-radius: var(--radius-xs);
  padding: 2px 8px; width: 100%; outline: none;
  display: none;
}

.seller-real-name {
  font-size: 11px; color: var(--text3);
  font-family: 'Poppins', monospace;
}

.seller-card-actions {
  display: flex; gap: 6px; flex-shrink: 0; margin-left: 10px;
}

.btn-icon {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); width: 28px; height: 28px;
  border-radius: var(--radius-xs); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--grad1); color: var(--grad1); }
.btn-icon.danger:hover { border-color: var(--red); color: var(--red); }

.seller-card-metrics {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 16px;
}

.seller-mini-metric {
  background: var(--bg3); border-radius: var(--radius-xs);
  padding: 10px 12px;
}
.seller-mini-label {
  font-size: 9px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px;
}
.seller-mini-value {
  font-size: 16px; font-weight: 600;
  font-family: 'Bricolage Grotesque', sans-serif;
}
.seller-mini-loading {
  font-size: 11px; color: var(--text3); font-style: italic;
}

.seller-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 14px; border-top: 1px solid var(--border);
}

.seller-id-badge {
  font-size: 10px; color: var(--text3);
  font-family: 'Poppins', monospace;
  background: var(--bg3); padding: 3px 8px;
  border-radius: var(--radius-xs);
}

.btn-open {
  background: linear-gradient(135deg, var(--grad1), var(--grad3));
  color: #fff; font-family: 'Poppins', sans-serif;
  font-size: 11px; font-weight: 600; padding: 6px 14px;
  border: none; border-radius: var(--radius-xs); cursor: pointer;
  transition: opacity 0.15s;
}
.btn-open:hover { opacity: 0.88; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 80px 20px;
}
.empty-icon { font-size: 52px; margin-bottom: 16px; opacity: 0.2; }
.empty-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 20px; font-weight: 700; color: var(--text2); margin-bottom: 8px;
}
.empty-sub { font-size: 13px; color: var(--text3); margin-bottom: 24px; }

/* ── DETAIL VIEW ── */
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text2); font-family: 'Poppins', sans-serif;
  font-size: 12px; padding: 7px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: all 0.15s; margin-bottom: 20px;
}
.back-btn:hover { color: var(--text); border-color: var(--border2); }

.detail-header { margin-bottom: 20px; }
.detail-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 28px; font-weight: 700; letter-spacing: -0.6px;
}
.detail-meta { font-size: 12px; color: var(--text3); margin-top: 4px; }

/* ── TABS ── */
.tabs {
  display: flex; gap: 2px; margin-bottom: 24px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px;
  width: fit-content;
}

.tab-btn {
  background: transparent; border: none;
  color: var(--text3); font-family: 'Poppins', sans-serif;
  font-size: 13px; font-weight: 500; padding: 8px 18px;
  border-radius: var(--radius-xs); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn:hover { color: var(--text2); background: var(--bg3); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--grad1), var(--grad3));
  color: #fff;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── METRICS ── */
.section-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px; margin-bottom: 20px;
}

.metric-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
  transition: border-color 0.15s;
}
.metric-card:hover { border-color: var(--border2); }
.metric-label {
  font-size: 10px; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px;
}
.metric-value {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: -0.4px;
}
.metric-delta { font-size: 11px; margin-top: 5px; color: var(--text3); }
.delta-up { color: var(--green); }
.delta-down { color: var(--red); }

/* ── CARDS ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px;
}
.card-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 14px; font-weight: 700; margin-bottom: 3px;
}
.card-sub { font-size: 12px; color: var(--text3); margin-bottom: 14px; }

/* ── BADGES ── */
.badge {
  display: inline-block; padding: 3px 9px;
  border-radius: 99px; font-size: 10px; font-weight: 600;
}
.badge-green { background: var(--green2); color: var(--green); }
.badge-amber { background: var(--amber2); color: var(--amber); }
.badge-red { background: var(--red2); color: var(--red); }
.badge-blue { background: var(--blue2); color: var(--blue); }
.badge-gray { background: rgba(255,255,255,0.06); color: var(--text3); }

/* ── TABLES ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  text-align: left; padding: 0 10px 10px;
  font-size: 10px; font-weight: 500; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 10px 10px; border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,0.02); }
.cell-name {
  font-weight: 500; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: inline-block;
}

/* ── REP BARS ── */
.rep-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rep-bar-label { font-size: 12px; color: var(--text2); width: 130px; flex-shrink: 0; }
.rep-bar-track { flex: 1; height: 5px; background: var(--bg4); border-radius: 3px; }
.rep-bar-fill { height: 5px; border-radius: 3px; }
.rep-bar-val { font-size: 11px; color: var(--text2); width: 38px; text-align: right; flex-shrink: 0; }

/* ── LEGEND ── */
.legend { display: flex; gap: 14px; margin-bottom: 10px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 8px; height: 8px; border-radius: 2px; }

/* ── LOADING ── */
.loading-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 20px; color: var(--text3); gap: 12px;
}
.spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--border2);
  border-top-color: var(--grad1);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── PROMO TYPE ── */
.promo-type { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }

@media (max-width: 900px) {
  .main { padding: 20px 16px; }
  .topbar { padding: 0 16px; }
  .two-col { grid-template-columns: 1fr; }
  .metrics-grid { grid-template-columns: repeat(2,1fr); }
  .tabs { width: 100%; flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-wrap">
    <div class="logo-petina">
      <div class="logo-icon">P</div>
      <div class="logo-text">
        <div class="logo-name">GRUPO PETINA</div>
        <div class="logo-sub">Dashboard ML</div>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="period-wrap">
      <div class="period-dropdown" id="period-dropdown">
        <button class="period-trigger" id="period-trigger" onclick="togglePeriodDropdown(event)">
          <span id="period-label">Últimos 30 dias</span>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="transition:transform 0.2s" id="period-chevron"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="period-menu" id="period-menu">
          <div class="period-menu-option" onclick="selectPeriodOption('today','Hoje')">
            <span class="period-option-label">Hoje</span>
            <span class="period-option-sub" id="sub-today"></span>
          </div>
          <div class="period-menu-option selected" id="opt-7" onclick="selectPeriodOption('7','Últimos 7 dias')">
            <span class="period-option-label">Últimos 7 dias</span>
            <span class="period-option-sub" id="sub-7"></span>
          </div>
          <div class="period-menu-option" id="opt-15" onclick="selectPeriodOption('15','Últimos 15 dias')">
            <span class="period-option-label">Últimos 15 dias</span>
            <span class="period-option-sub" id="sub-15"></span>
          </div>
          <div class="period-menu-option selected" id="opt-30" onclick="selectPeriodOption('30','Últimos 30 dias')">
            <span class="period-option-label">Últimos 30 dias</span>
            <span class="period-option-sub" id="sub-30"></span>
          </div>
          <div class="period-menu-option" onclick="selectPeriodOption('custom','Data personalizada')">
            <span class="period-option-label">Data personalizada</span>
          </div>
          <div class="period-custom-row" id="period-custom-row">
            <input type="date" id="date-from" class="date-input">
            <span style="color:var(--text3);font-size:11px">até</span>
            <input type="date" id="date-to" class="date-input">
            <button class="btn-apply" onclick="applyCustomDate()">Aplicar</button>
          </div>
        </div>
      </div>
    </div>
    <button class="btn-connect" onclick="window.location='/auth'">+ Conectar Seller</button>
  </div>
</div>

<div class="main">
  <div class="alert" id="alert"></div>

  <!-- VIEW: LISTA -->
  <div class="view active" id="view-list">
    <div class="list-header">
      <div>
        <div class="list-title">Sellers Conectados</div>
        <div class="list-sub" id="list-sub">Carregando...</div>
      </div>
    </div>
    <div id="sellers-grid"></div>
  </div>

  <!-- VIEW: DETALHE -->
  <div class="view" id="view-detail">
    <button class="back-btn" onclick="showList()">← Voltar</button>
    <div class="detail-header">
      <div class="detail-name" id="d-name">—</div>
      <div class="detail-meta" id="d-meta">—</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-vendas-btn" onclick="switchTab('vendas')">💰 Vendas</button>
      <button class="tab-btn" id="tab-campanhas-btn" onclick="switchTab('campanhas')">📣 Campanhas</button>
      <button class="tab-btn" id="tab-promocoes-btn" onclick="switchTab('promocoes')">🎯 Promoções</button>
      <button class="tab-btn" id="tab-reputacao-btn" onclick="switchTab('reputacao')">⭐ Reputação</button>
      <button class="tab-btn" id="tab-produtos-btn" onclick="switchTab('produtos')">📦 Produtos</button>
    </div>

    <div class="tab-content active" id="tab-vendas"><div class="loading-state"><div class="spinner"></div><span>Carregando vendas...</span></div></div>
    <div class="tab-content" id="tab-campanhas"><div class="loading-state"><div class="spinner"></div><span>Carregando campanhas...</span></div></div>
    <div class="tab-content" id="tab-promocoes"><div class="loading-state"><div class="spinner"></div><span>Carregando promoções...</span></div></div>
    <div class="tab-content" id="tab-reputacao"><div class="loading-state"><div class="spinner"></div><span>Carregando reputação...</span></div></div>
    <div class="tab-content" id="tab-produtos"><div class="loading-state"><div class="spinner"></div><span>Carregando produtos...</span></div></div>
  </div>
</div>

<script>
var allSellers = [];
var currentSellerId = null;
var activeTab = 'vendas';
var charts = {};
var loaded = {};
var sellerNames = {};

try { sellerNames = JSON.parse(localStorage.getItem('petina_seller_names') || '{}'); } catch(e) {}

function saveNames(){ try { localStorage.setItem('petina_seller_names', JSON.stringify(sellerNames)); } catch(e) {} }

function fmt(n){ return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDec(n){ return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtFull(n){ return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtK(n){ if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(1)+'k'; return String(n); }

var currentPeriodValue = '30';

function buildPeriodSubtitles(){
  var today = new Date();
  var fmt2 = function(d){ return d.getDate()+' '+['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()]+' '+d.getFullYear(); };
  var sub = function(days){
    var from = new Date(); from.setDate(from.getDate()-days);
    return fmt2(from)+' a '+fmt2(today);
  };
  var todayStr = fmt2(today);
  var el = document.getElementById('sub-today'); if(el) el.textContent = todayStr;
  var el7 = document.getElementById('sub-7'); if(el7) el7.textContent = sub(7);
  var el15 = document.getElementById('sub-15'); if(el15) el15.textContent = sub(15);
  var el30 = document.getElementById('sub-30'); if(el30) el30.textContent = sub(30);
}

function togglePeriodDropdown(e){
  e.stopPropagation();
  var menu = document.getElementById('period-menu');
  var trigger = document.getElementById('period-trigger');
  var chevron = document.getElementById('period-chevron');
  var isOpen = menu.classList.contains('open');
  menu.classList.toggle('open');
  trigger.classList.toggle('open');
  chevron.style.transform = isOpen ? '' : 'rotate(180deg)';
}

function selectPeriodOption(value, label){
  currentPeriodValue = value;
  document.getElementById('period-label').textContent = label;

  // Remove selected de todas
  document.querySelectorAll('.period-menu-option').forEach(function(o){ o.classList.remove('selected'); });

  // Fecha menu (exceto se custom)
  if(value !== 'custom'){
    document.getElementById('period-menu').classList.remove('open');
    document.getElementById('period-trigger').classList.remove('open');
    document.getElementById('period-chevron').style.transform = '';
    document.getElementById('period-custom-row').classList.remove('open');
    if(currentSellerId){ reloadCurrentTab(); }
  } else {
    document.getElementById('period-custom-row').classList.add('open');
    var to = new Date(), from = new Date();
    from.setDate(from.getDate()-30);
    document.getElementById('date-from').value = from.toISOString().split('T')[0];
    document.getElementById('date-to').value = to.toISOString().split('T')[0];
  }
}

function getPeriodDates(){
  if(currentPeriodValue === 'custom'){
    var df = document.getElementById('date-from').value;
    var dt = document.getElementById('date-to').value;
    if(df && dt) return {date_from: df, date_to: dt};
  }
  if(currentPeriodValue === 'today'){
    var t = new Date().toISOString().split('T')[0];
    return {date_from: t, date_to: t};
  }
  var days = parseInt(currentPeriodValue) || 30;
  var to = new Date(), from = new Date();
  from.setDate(from.getDate() - days);
  return {date_from: from.toISOString().split('T')[0], date_to: to.toISOString().split('T')[0]};
}

function applyCustomDate(){
  var df = document.getElementById('date-from').value;
  var dt = document.getElementById('date-to').value;
  if(!df || !dt){ alert('Selecione as duas datas.'); return; }
  if(df > dt){ alert('Data inicial deve ser anterior à data final.'); return; }
  // Atualiza label
  var fmtBR = function(s){ var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; };
  document.getElementById('period-label').textContent = fmtBR(df)+' – '+fmtBR(dt);
  document.getElementById('period-menu').classList.remove('open');
  document.getElementById('period-trigger').classList.remove('open');
  document.getElementById('period-chevron').style.transform = '';
  if(currentSellerId){ reloadCurrentTab(); }
}

// Fechar dropdown clicando fora
document.addEventListener('click', function(e){
  var dd = document.getElementById('period-dropdown');
  if(dd && !dd.contains(e.target)){
    document.getElementById('period-menu').classList.remove('open');
    document.getElementById('period-trigger').classList.remove('open');
    document.getElementById('period-chevron').style.transform = '';
  }
});

buildPeriodSubtitles();

function reloadCurrentTab(){
  loaded = {};
  destroyCharts();
  document.querySelectorAll('.tab-content').forEach(function(c){
    if(c.classList.contains('active')){
      c.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Atualizando...</span></div>';
    }
  });
  loadTab(activeTab);
}

function destroyCharts(){
  Object.keys(charts).forEach(function(k){ if(charts[k]){ charts[k].destroy(); charts[k]=null; } });
}

function showList(){
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-detail').classList.remove('active');
  destroyCharts();
  currentSellerId = null;
  loaded = {};
  loadList();
}

async function loadList(){
  var resp = await fetch('/api/sellers');
  allSellers = await resp.json();
  var grid = document.getElementById('sellers-grid');

  if(!allSellers.length){
    document.getElementById('list-sub').textContent = '0 sellers conectados';
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-title">Nenhum seller conectado</div><div class="empty-sub">Conecte seu primeiro seller para começar</div><button class="btn-connect" onclick="window.location=\'/auth\'">+ Conectar Seller</button></div>';
    return;
  }

  document.getElementById('list-sub').textContent = allSellers.length + ' seller(s) — clique para abrir o painel';

  var html = allSellers.map(function(s){
    var displayName = sellerNames[s.user_id] || s.nickname || 'Seller';
    return '<div class="seller-card" id="card-'+s.user_id+'" onclick="selectSeller(\''+s.user_id+'\')">' +
      '<div class="seller-card-top">' +
        '<div class="seller-card-info">' +
          '<div class="seller-display-name" id="dname-'+s.user_id+'">'+displayName+'</div>' +
          '<input class="seller-display-name-input" id="dinput-'+s.user_id+'" value="'+displayName+'" onblur="saveName(\''+s.user_id+'\')" onkeydown="nameKeydown(event,\''+s.user_id+'\')" onclick="event.stopPropagation()">' +
          '<div class="seller-real-name">'+s.nickname+' · '+s.user_id+'</div>' +
        '</div>' +
        '<div class="seller-card-actions">' +
          '<button class="btn-icon" title="Renomear" onclick="event.stopPropagation();editName(\''+s.user_id+'\')">✏️</button>' +
          '<button class="btn-icon danger" title="Remover" data-seller-id="'+s.user_id+'" data-seller-name="'+displayName.replace(/"/g,'&quot;')+'" onclick="event.stopPropagation();removeSeller(this)">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="seller-card-metrics">' +
        '<div class="seller-mini-metric">' +
          '<div class="seller-mini-label">Vendas Brutas Hoje</div>' +
          '<div class="seller-mini-value" id="today-gmv-'+s.user_id+'"><div class="seller-mini-loading">...</div></div>' +
        '</div>' +
        '<div class="seller-mini-metric">' +
          '<div class="seller-mini-label">Qtd Vendas Hoje</div>' +
          '<div class="seller-mini-value" id="today-qty-'+s.user_id+'"><div class="seller-mini-loading">...</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="seller-card-footer">' +
        '<span class="seller-id-badge">ID: '+s.user_id+'</span>' +
        '<button class="btn-open" onclick="event.stopPropagation();selectSeller(\''+s.user_id+'\')">Abrir painel →</button>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.innerHTML = '<div class="sellers-grid">'+html+'</div>';

  // Carrega dados do dia para cada seller
  allSellers.forEach(function(s){ loadTodayMetrics(s.user_id); });
}

async function loadTodayMetrics(userId){
  var today = new Date().toISOString().split('T')[0];
  try {
    var r = await fetch('/api/sales/'+userId+'?date_from='+today+'&date_to='+today);
    if(!r.ok) throw new Error();
    var d = await r.json();
    var gmvEl = document.getElementById('today-gmv-'+userId);
    var qtyEl = document.getElementById('today-qty-'+userId);
    if(gmvEl) gmvEl.innerHTML = fmt(d.summary.vendas_brutas||0);
    if(qtyEl) qtyEl.innerHTML = fmtFull(d.summary.qtd_vendas||0);
  } catch(e) {
    var gmvEl = document.getElementById('today-gmv-'+userId);
    var qtyEl = document.getElementById('today-qty-'+userId);
    if(gmvEl) gmvEl.innerHTML = '<span style="color:var(--text3);font-size:11px">—</span>';
    if(qtyEl) qtyEl.innerHTML = '<span style="color:var(--text3);font-size:11px">—</span>';
  }
}

function editName(userId){
  var nameEl = document.getElementById('dname-'+userId);
  var inputEl = document.getElementById('dinput-'+userId);
  nameEl.style.display = 'none';
  inputEl.style.display = 'block';
  inputEl.focus();
  inputEl.select();
}

function saveName(userId){
  var nameEl = document.getElementById('dname-'+userId);
  var inputEl = document.getElementById('dinput-'+userId);
  var newName = inputEl.value.trim() || nameEl.textContent;
  sellerNames[userId] = newName;
  saveNames();
  nameEl.textContent = newName;
  nameEl.style.display = 'block';
  inputEl.style.display = 'none';
}

function nameKeydown(e, userId){
  if(e.key === 'Enter') saveName(userId);
  if(e.key === 'Escape'){
    var nameEl = document.getElementById('dname-'+userId);
    var inputEl = document.getElementById('dinput-'+userId);
    nameEl.style.display = 'block';
    inputEl.style.display = 'none';
  }
}

function selectSeller(sellerId){
  currentSellerId = sellerId;
  loaded = {};
  destroyCharts();
  var seller = allSellers.find(function(s){ return String(s.user_id)===String(sellerId); });
  var displayName = sellerNames[sellerId] || (seller ? seller.nickname : 'Seller');

  document.getElementById('view-list').classList.remove('active');
  document.getElementById('view-detail').classList.add('active');
  document.getElementById('d-name').textContent = displayName;
  document.getElementById('d-meta').textContent = (seller ? seller.nickname : '') + ' · ID: ' + sellerId;

  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-vendas-btn').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(c){
    c.classList.remove('active');
    c.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Carregando...</span></div>';
  });
  document.getElementById('tab-vendas').classList.add('active');
  activeTab = 'vendas';
  loadTab('vendas');
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('tab-'+tab+'-btn').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
  document.getElementById('tab-'+tab).classList.add('active');
  if(!loaded[tab]) loadTab(tab);
}

async function loadTab(tab){
  if(!currentSellerId) return;
  loaded[tab] = true;
  var dates = getPeriodDates();
  var el = document.getElementById('tab-'+tab);

  try {
    if(tab === 'vendas'){
      var isToday = dates.date_from === dates.date_to && dates.date_from === new Date().toISOString().split('T')[0];
      var d = await fetch('/api/sales/'+currentSellerId+'?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.json();});
      renderVendas(el, d, isToday);
    } else if(tab === 'campanhas'){
      var ads = await fetch('/api/ads/'+currentSellerId+'?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.json();});
      var daily = await fetch('/api/ads/'+currentSellerId+'/daily?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
      renderCampanhas(el, ads, daily);
    } else if(tab === 'promocoes'){
      var promos = await fetch('/api/promotions/'+currentSellerId).then(function(r){return r.json();});
      renderPromocoes(el, promos);
    } else if(tab === 'produtos'){
      var sales = await fetch('/api/sales/'+currentSellerId+'?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.json();});
      renderProdutos(el, sales);
    } else if(tab === 'reputacao'){
      var rep = await fetch('/api/reputation/'+currentSellerId).then(function(r){return r.json();});
      renderReputacao(el, rep);
    }
  } catch(e){
    el.innerHTML = '<div class="loading-state"><span style="color:var(--red)">Erro ao carregar dados. Tente novamente.</span></div>';
  }
}

function varBadge(v){
  if(v===0||v===null||v===undefined) return '<span style="font-size:11px;color:var(--text3)">—</span>';
  var color = v>=0 ? 'var(--green)' : 'var(--red)';
  return '<span style="font-size:11px;color:'+color+'">'+(v>=0?'▲':'▼')+Math.abs(v)+'%</span>';
}

function renderVendas(el, data, isToday){
  var s = data.summary || {};
  var cmp = data.comparison || {};
  var daily = data.daily_sales || [];
  var convColor = s.conversion>=3?'var(--green)':s.conversion>=1?'var(--amber)':'var(--red)';

  // Monta dados horários a partir dos pedidos brutos (quando "Hoje")
  // A API retorna data.orders[] com campo date_created
  var hourlyData = null;
  if(isToday){
    var hourBuckets = {};
    for(var h=0;h<24;h++) hourBuckets[h]={gmv:0,orders:0};
    var orders = data.orders || [];
    orders.forEach(function(o){
      var dt = new Date(o.date_created||o.date_closed||'');
      if(!isNaN(dt)){
        var hr = dt.getHours();
        hourBuckets[hr].orders++;
        var val = 0;
        if(o.payments&&o.payments.length) o.payments.forEach(function(p){val+=p.total_paid_amount||0;});
        else val = o.paid_amount||o.total_amount||0;
        hourBuckets[hr].gmv += val;
      }
    });
    hourlyData = [];
    for(var h=0;h<24;h++) hourlyData.push({hour:h, gmv:hourBuckets[h].gmv, orders:hourBuckets[h].orders});
  }

  el.innerHTML =
    '<div class="section-label">Resumo de Desempenho</div>'+
    '<div class="metrics-grid" style="grid-template-columns:repeat(auto-fit,minmax(165px,1fr))">'+
      '<div class="metric-card"><div class="metric-label">Vendas Brutas</div><div class="metric-value">'+fmt(s.vendas_brutas||0)+'</div><div class="metric-delta">'+varBadge(cmp.var_vendas_brutas)+' vs período anterior</div></div>'+
      '<div class="metric-card"><div class="metric-label">Unidades Vendidas</div><div class="metric-value">'+fmtFull(s.unidades_vendidas||0)+'</div><div class="metric-delta">'+varBadge(cmp.var_unidades)+' vs período anterior</div></div>'+
      '<div class="metric-card"><div class="metric-label">Preço Médio / Unidade</div><div class="metric-value">'+fmt(s.preco_medio_unidade||0)+'</div><div class="metric-delta">'+varBadge(cmp.var_avg_unit)+' vs período anterior</div></div>'+
      '<div class="metric-card"><div class="metric-label">Qtd de Vendas</div><div class="metric-value">'+fmtFull(s.qtd_vendas||0)+'</div><div class="metric-delta">'+varBadge(cmp.var_qtd_vendas)+' vs período anterior</div></div>'+
      '<div class="metric-card"><div class="metric-label">Preço Médio / Venda</div><div class="metric-value">'+fmt(s.preco_medio_venda||0)+'</div><div class="metric-delta">por pedido</div></div>'+
      '<div class="metric-card"><div class="metric-label">Visitas</div><div class="metric-value">'+fmtFull(s.total_visits||0)+'</div><div class="metric-delta">nos anúncios</div></div>'+
      '<div class="metric-card"><div class="metric-label">Conversão</div><div class="metric-value" style="color:'+convColor+'">'+(s.conversion||0)+'%</div><div class="metric-delta">visitas → venda</div></div>'+
      '<div class="metric-card"><div class="metric-label">Qtd Canceladas</div><div class="metric-value" style="color:'+(s.qtd_canceladas>0?'var(--red)':'var(--text)')+'">'+fmtFull(s.qtd_canceladas||0)+'</div><div class="metric-delta">no período</div></div>'+
      '<div class="metric-card"><div class="metric-label">Valor Cancelamentos</div><div class="metric-value" style="color:'+(s.valor_canceladas>0?'var(--red)':'var(--text)')+'">'+fmt(s.valor_canceladas||0)+'</div><div class="metric-delta">no período</div></div>'+
    '</div>'+

    '<div class="section-label">Comparativo de Períodos</div>'+
    '<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">'+
        '<div>'+
          '<div class="card-title">Atual vs Período Anterior</div>'+
          '<div style="font-size:11px;color:var(--text3);margin-top:3px">'+
            fmtDate(data.period&&data.period.date_from)+' – '+fmtDate(data.period&&data.period.date_to)+
            ' <span style="margin:0 6px;opacity:0.4">vs</span> '+
            fmtDate(cmp.prev_period&&cmp.prev_period.date_from)+' – '+fmtDate(cmp.prev_period&&cmp.prev_period.date_to)+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+
        '<div style="background:var(--bg3);border-radius:var(--radius-sm);padding:14px 16px">'+
          '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Vendas Brutas</div>'+
          '<div style="font-size:20px;font-weight:700;font-family:Bricolage Grotesque,sans-serif;margin-bottom:6px">'+fmt(s.vendas_brutas||0)+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<span style="font-size:11px;color:var(--text3)">Ant: '+fmt(cmp.prev_vendas_brutas||0)+'</span>'+
            '<span style="font-size:12px;font-weight:600;color:'+((cmp.var_vendas_brutas||0)>=0?'var(--green)':'var(--red)')+'">'+((cmp.var_vendas_brutas||0)>=0?'▲':'▼')+Math.abs(cmp.var_vendas_brutas||0)+'%</span>'+
          '</div>'+
        '</div>'+
        '<div style="background:var(--bg3);border-radius:var(--radius-sm);padding:14px 16px">'+
          '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Qtd de Vendas</div>'+
          '<div style="font-size:20px;font-weight:700;font-family:Bricolage Grotesque,sans-serif;margin-bottom:6px">'+fmtFull(s.qtd_vendas||0)+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<span style="font-size:11px;color:var(--text3)">Ant: '+fmtFull(cmp.prev_qtd_vendas||0)+'</span>'+
            '<span style="font-size:12px;font-weight:600;color:'+((cmp.var_qtd_vendas||0)>=0?'var(--green)':'var(--red)')+'">'+((cmp.var_qtd_vendas||0)>=0?'▲':'▼')+Math.abs(cmp.var_qtd_vendas||0)+'%</span>'+
          '</div>'+
        '</div>'+
        '<div style="background:var(--bg3);border-radius:var(--radius-sm);padding:14px 16px">'+
          '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px">Unidades Vendidas</div>'+
          '<div style="font-size:20px;font-weight:700;font-family:Bricolage Grotesque,sans-serif;margin-bottom:6px">'+fmtFull(s.unidades_vendidas||0)+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<span style="font-size:11px;color:var(--text3)">Ant: '+fmtFull(cmp.prev_unidades||0)+'</span>'+
            '<span style="font-size:12px;font-weight:600;color:'+((cmp.var_unidades||0)>=0?'var(--green)':'var(--red)')+'">'+((cmp.var_unidades||0)>=0?'▲':'▼')+Math.abs(cmp.var_unidades||0)+'%</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    '<div class="section-label">Evolução</div>'+
    '<div class="card">'+
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">'+
        '<div><div class="card-title">'+(isToday?'Vendas por Hora — Hoje':'Vendas Brutas por Dia')+'</div><div class="card-sub" style="margin-bottom:0">'+(isToday?'Faturamento acumulado hora a hora (00h–23h)':'Faturamento e quantidade de vendas dia a dia')+'</div></div>'+
        '<div class="legend" style="margin-bottom:0"><span class="leg"><span class="leg-dot" style="background:#2ecc9a"></span>Vendas Brutas</span><span class="leg"><span class="leg-dot" style="background:rgba(74,95,232,0.7)"></span>Qtd Vendas</span></div>'+
      '</div>'+
      '<div style="position:relative;height:240px"><canvas id="chart-daily-sales"></canvas></div>'+
    '</div>'+

    '';

  setTimeout(function(){
    var canvas = document.getElementById('chart-daily-sales');
    if(!canvas) return;
    if(charts.dailySales){ charts.dailySales.destroy(); charts.dailySales=null; }

    var chartLabels, chartGmv, chartOrders;
    if(isToday && hourlyData){
      chartLabels = hourlyData.map(function(h){ return h.hour+'h'; });
      chartGmv    = hourlyData.map(function(h){ return h.gmv; });
      chartOrders = hourlyData.map(function(h){ return h.orders; });
    } else {
      if(!daily.length) return;
      chartLabels = daily.map(function(d){ return fmtDate(d.date); });
      chartGmv    = daily.map(function(d){ return d.gmv; });
      chartOrders = daily.map(function(d){ return d.orders; });
    }

    charts.dailySales = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: chartLabels,
        datasets: [
          {
            label: 'Vendas Brutas',
            data: chartGmv,
            backgroundColor: 'rgba(46,204,154,0.65)',
            borderColor: '#2ecc9a',
            borderWidth: 1, borderRadius: 5, borderSkipped: false,
            yAxisID: 'y'
          },
          {
            label: 'Qtd Vendas',
            data: chartOrders,
            type: 'line',
            borderColor: 'rgba(74,95,232,0.9)',
            backgroundColor: 'transparent',
            borderWidth: 2, tension: 0.3,
            pointRadius: 3, pointHoverRadius: 5,
            yAxisID: 'y2'
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, labels: { color: '#9898b0', font: { size: 11, family: 'Poppins' }, boxWidth: 10, usePointStyle: true } },
          tooltip: { callbacks: {
            label: function(c){
              if(c.datasetIndex===0) return ' R$'+fmtFull(c.raw);
              return ' '+fmtFull(c.raw)+' vendas';
            }
          }}
        },

      '<div class="metric-card"><div class="metric-label">Cliques</div><div class="metric-value">'+fmtK(s.clicks)+'</div><div class="metric-delta">CTR: '+ctr+'%</div></div>'+

    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:16px 20px;border-bottom:1px solid var(--border)"><div class="card-title">Central de Promoções</div><div class="card-sub" style="margin-bottom:0">'+total+' promoção(ões) ativa(s)</div></div>'+
      '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Promoção / Tipo</th><th>Status</th><th>Início</th><th>Fim</th></tr></thead><tbody>'+emptyPromos+'</tbody></table></div>'+

function toggleProduct(id){
  var row = document.getElementById(id);
  if(row) row.style.display = row.style.display==='none'?'table-row':'none';
}

function filterProducts(q){
  var el = document.getElementById('tab-produtos');
  if(!el || !el._products) return;
  var filtered = el._products.filter(function(p){ return p.title.toLowerCase().includes(q.toLowerCase()); });
  var tbody = document.getElementById('prod-tbody');
  if(tbody){
    var tmp = document.createElement('div');
    tmp.innerHTML = '<table><tbody>'+renderProductRows(filtered)+'</tbody></table>';
    tbody.innerHTML = renderProductRows(filtered);
  }
}

        '<div class="rep-bar-wrap" style="margin-bottom:0"><div class="rep-bar-label">❌ Negativas</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+negRate+'%;background:var(--red)"></div></div><div class="rep-bar-val">'+negRate+'%</div></div>'+
      '</div>'+
      '<div class="card"><div class="card-title">Métricas Operacionais</div><div class="card-sub">Indicadores dos últimos 365 dias</div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">Cancelamentos</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.cancellations||0)*500,100)+'%;background:'+cancelColor+'"></div></div><div class="rep-bar-val" style="color:'+cancelColor+'">'+cancelRate+'%</div></div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">Reclamações</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.claims||0)*500,100)+'%;background:'+claimsColor+'"></div></div><div class="rep-bar-val" style="color:'+claimsColor+'">'+claimsRate+'%</div></div>'+
        '<div class="rep-bar-wrap" style="margin-bottom:0"><div class="rep-bar-label">Atrasos</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.delayed||0)*200,100)+'%;background:'+delayedColor+'"></div></div><div class="rep-bar-val" style="color:'+delayedColor+'">'+delayedRate+'%</div></div>'+
        '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)">Metas: cancelamentos ≤ 2% · reclamações ≤ 2% · atrasos ≤ 5%</div>'+
      '</div>'+
    '</div>';
}

async function removeSeller(btn){
  var sellerId = btn.getAttribute('data-seller-id');
  var name = btn.getAttribute('data-seller-name');
  if(!confirm('Remover "'+name+'" do dashboard?')) return;
  try {
    var r = await fetch('/api/sellers/'+sellerId, {method:'DELETE'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    allSellers = allSellers.filter(function(s){ return String(s.user_id)!==String(sellerId); });
    loadList();
  } catch(e) {
    alert('Erro ao remover seller. Tente novamente.');
  }
}



var params = new URLSearchParams(window.location.search);
if(params.get('seller_added')){
  var el = document.getElementById('alert');
  el.textContent = '✓ Seller "'+params.get('seller_added')+'" conectado com sucesso!';
  el.style.display = 'block';
  setTimeout(function(){ el.style.display='none'; }, 5000);
  history.replaceState({}, '', '/');
}

loadList();
</script>
