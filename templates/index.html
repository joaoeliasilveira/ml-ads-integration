<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Mercado Livre</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:#0f0f0f;--bg2:#181818;--bg3:#222222;--bg4:#2a2a2a;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f0;--text2:#999;--text3:#666;
  --yellow:#FFE600;--green:#1DB97A;--green2:rgba(29,185,122,0.12);
  --red:#FF5252;--red2:rgba(255,82,82,0.12);
  --amber:#F5A623;--amber2:rgba(245,166,35,0.12);
  --blue:#4A9EFF;--blue2:rgba(74,158,255,0.12);
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{width:36px;height:36px;background:var(--yellow);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-0.3px;}
.brand-sub{font-size:12px;color:var(--text3);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.period-select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;outline:none;}
.btn-connect{background:var(--yellow);color:#000;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:opacity 0.15s;}
.btn-connect:hover{opacity:0.88;}

.main{padding:28px 32px;max-width:1400px;margin:0 auto;}
.alert{background:var(--green2);border:1px solid var(--green);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--green);margin-bottom:24px;display:none;}

.view{display:none;}
.view.active{display:block;}

/* LIST */
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.4px;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:24px;}
.sellers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.seller-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all 0.15s;}
.seller-card:hover{border-color:var(--yellow);transform:translateY(-1px);}
.seller-card-name{font-size:15px;font-weight:600;}
.seller-card-id{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);margin-top:2px;margin-bottom:16px;}
.seller-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.btn-select{background:var(--yellow);color:#000;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;border:none;border-radius:var(--radius-sm);cursor:pointer;}
.btn-remove-card{background:transparent;border:1px solid rgba(255,82,82,0.3);color:var(--red);font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;}
.btn-remove-card:hover{background:var(--red2);}

.empty-state{text-align:center;padding:80px 20px;color:var(--text3);}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:0.3;}
.empty-title{font-size:18px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.empty-sub{font-size:13px;margin-bottom:24px;}

/* DETAIL */
.back-btn{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:20px;width:fit-content;transition:all 0.15s;}
.back-btn:hover{color:var(--text);}
.detail-seller-name{font-size:24px;font-weight:600;letter-spacing:-0.5px;}
.detail-seller-id{font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);margin-top:4px;margin-bottom:20px;}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:10px 16px;cursor:pointer;transition:all 0.15s;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text2);}
.tab-btn.active{color:var(--yellow);border-bottom-color:var(--yellow);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* CARDS */
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.metric-value{font-size:24px;font-weight:500;letter-spacing:-0.5px;}
.metric-delta{font-size:12px;margin-top:6px;color:var(--text3);}
.delta-up{color:var(--green);}
.delta-down{color:var(--red);}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:500;margin-bottom:4px;}
.card-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;}
.badge-green{background:var(--green2);color:var(--green);}
.badge-amber{background:var(--amber2);color:var(--amber);}
.badge-red{background:var(--red2);color:var(--red);}
.badge-blue{background:var(--blue2);color:var(--blue);}
.badge-gray{background:rgba(255,255,255,0.06);color:var(--text3);}

.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;padding:0 10px 10px;font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--border);}
.data-table td{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(255,255,255,0.02);}
.cell-name{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.rep-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rep-bar-label{font-size:12px;color:var(--text2);width:130px;flex-shrink:0;}
.rep-bar-track{flex:1;height:6px;background:var(--bg4);border-radius:3px;}
.rep-bar-fill{height:6px;border-radius:3px;}
.rep-bar-val{font-size:12px;color:var(--text2);width:40px;text-align:right;flex-shrink:0;}

.legend{display:flex;gap:16px;margin-bottom:12px;}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.leg-dot{width:10px;height:10px;border-radius:3px;}

.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:12px;}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--yellow);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.promo-type{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;}

@media(max-width:900px){
  .main{padding:20px 16px;}
  .topbar{padding:12px 16px;}
  .two-col{grid-template-columns:1fr;}
  .metrics-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">📊</div>
    <div><div class="brand-name">Dashboard ML</div><div class="brand-sub">Mercado Livre</div></div>
  </div>
  <div class="topbar-right">
    <div style="display:flex;align-items:center;gap:8px">
      <select class="period-select" id="period-preset" onchange="applyPreset()">
        <option value="7">Últimos 7 dias</option>
        <option value="30" selected>Últimos 30 dias</option>
        <option value="90">Últimos 90 dias</option>
        <option value="custom">Personalizado</option>
      </select>
      <div id="custom-dates" style="display:none;align-items:center;gap:6px">
        <input type="date" id="date-from" class="period-select" style="font-size:12px;padding:7px 10px">
        <span style="color:var(--text3);font-size:12px">até</span>
        <input type="date" id="date-to" class="period-select" style="font-size:12px;padding:7px 10px">
        <button onclick="applyCustomDate()" style="background:var(--yellow);color:#000;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:7px 12px;border:none;border-radius:var(--radius-sm);cursor:pointer">Aplicar</button>
      </div>
    </div>
    <button class="btn-connect" onclick="window.location='/auth'">+ Conectar Seller</button>
  </div>
</div>

<div class="main">
  <div class="alert" id="alert"></div>

  <!-- VIEW: LISTA -->
  <div class="view active" id="view-list">
    <div class="page-title">Sellers Conectados</div>
    <div class="page-sub" id="list-sub">Carregando...</div>
    <div id="sellers-grid"></div>
  </div>

  <!-- VIEW: DETALHE -->
  <div class="view" id="view-detail">
    <button class="back-btn" onclick="showList()">← Voltar</button>
    <div class="detail-seller-name" id="d-name">—</div>
    <div class="detail-seller-id" id="d-id">—</div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('campanhas')">📣 Campanhas</button>
      <button class="tab-btn" onclick="switchTab('reputacao')">⭐ Reputação</button>
      <button class="tab-btn" onclick="switchTab('vendas')">💰 Vendas</button>
      <button class="tab-btn" onclick="switchTab('promocoes')">🎯 Promoções</button>
    </div>

    <!-- TAB: CAMPANHAS -->
    <div class="tab-content active" id="tab-campanhas">
      <div class="loading-state"><div class="spinner"></div><span>Carregando campanhas...</span></div>
    </div>

    <!-- TAB: REPUTACAO -->
    <div class="tab-content" id="tab-reputacao">
      <div class="loading-state"><div class="spinner"></div><span>Carregando reputação...</span></div>
    </div>

    <!-- TAB: VENDAS -->
    <div class="tab-content" id="tab-vendas">
      <div class="loading-state"><div class="spinner"></div><span>Carregando vendas...</span></div>
    </div>

    <!-- TAB: PROMOCOES -->
    <div class="tab-content" id="tab-promocoes">
      <div class="loading-state"><div class="spinner"></div><span>Carregando promoções...</span></div>
    </div>
  </div>
</div>

<script>
var allSellers = [];
var currentSellerId = null;
var activeTab = 'campanhas';
var charts = {};
var loaded = {};

function fmt(n){return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtDec(n){return 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtK(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(1)+'k';return String(n);}
function fmtFull(n){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});}

function getPeriodDates(){
  var preset=document.getElementById('period-preset').value;
  if(preset==='custom'){
    var df=document.getElementById('date-from').value;
    var dt=document.getElementById('date-to').value;
    if(df&&dt) return{date_from:df,date_to:dt};
  }
  var days=parseInt(preset)||30;
  var to=new Date(),from=new Date();
  from.setDate(from.getDate()-days);
  return{date_from:from.toISOString().split('T')[0],date_to:to.toISOString().split('T')[0]};
}

function applyPreset(){
  var preset=document.getElementById('period-preset').value;
  var customDiv=document.getElementById('custom-dates');
  if(preset==='custom'){
    customDiv.style.display='flex';
    // Set default dates
    var to=new Date(),from=new Date();
    from.setDate(from.getDate()-30);
    document.getElementById('date-from').value=from.toISOString().split('T')[0];
    document.getElementById('date-to').value=to.toISOString().split('T')[0];
  } else {
    customDiv.style.display='none';
    if(currentSellerId){
      loaded={};
      destroyCharts();
      document.querySelectorAll('.tab-content').forEach(function(c){
        if(c.classList.contains('active')){
          c.innerHTML='<div class="loading-state"><div class="spinner"></div><span>Atualizando...</span></div>';
        }
      });
      loadTab(activeTab);
    }
  }
}

function applyCustomDate(){
  var df=document.getElementById('date-from').value;
  var dt=document.getElementById('date-to').value;
  if(!df||!dt){alert('Selecione as duas datas.');return;}
  if(df>dt){alert('Data inicial deve ser anterior à data final.');return;}
  if(currentSellerId){
    loaded={};
    destroyCharts();
    document.querySelectorAll('.tab-content').forEach(function(c){
      if(c.classList.contains('active')){
        c.innerHTML='<div class="loading-state"><div class="spinner"></div><span>Atualizando...</span></div>';
      }
    });
    loadTab(activeTab);
  }
}

function repLevel(l){
  var m={'1_red':['Vermelho','badge-red'],'2_orange':['Laranja','badge-red'],'3_yellow':['Amarelo','badge-amber'],'4_light_green':['Verde Claro','badge-green'],'5_green':['Verde','badge-green']};
  return m[l]||[l||'N/D','badge-gray'];
}
function powerSeller(s){
  var m={'platinum':['Platinum','badge-blue'],'gold':['Gold','badge-amber'],'silver':['Silver','badge-green'],'':['N/D','badge-gray']};
  return m[s]||[s||'N/D','badge-gray'];
}

function destroyCharts(){
  Object.keys(charts).forEach(function(k){if(charts[k]){charts[k].destroy();charts[k]=null;}});
}

function showList(){
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-detail').classList.remove('active');
  destroyCharts();
  currentSellerId=null;
  loaded={};
}

async function loadList(){
  var resp=await fetch('/api/sellers');
  allSellers=await resp.json();
  if(!allSellers.length){
    document.getElementById('list-sub').textContent='0 sellers conectados';
    document.getElementById('sellers-grid').innerHTML='<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-title">Nenhum seller conectado</div><div class="empty-sub">Clique em Conectar Seller para começar</div><button class="btn-connect" onclick="window.location=\'/auth\'">+ Conectar Seller</button></div>';
    return;
  }
  document.getElementById('list-sub').textContent=allSellers.length+' sellers conectados — selecione um para ver o painel completo';
  var html=allSellers.map(function(s){
    return '<div class="seller-card" onclick="selectSeller(\''+s.user_id+'\')">' +
      '<div class="seller-card-name">'+( s.nickname||'Seller')+'</div>' +
      '<div class="seller-card-id">'+s.user_id+'</div>' +
      '<div class="seller-card-footer">' +
        '<span style="font-size:12px;color:var(--text3)">Clique para abrir o painel</span>' +
        '<div style="display:flex;gap:6px">' +
          '<button class="btn-select" onclick="event.stopPropagation();selectSeller(\''+s.user_id+'\')">Ver painel →</button>' +
          '<button class="btn-remove-card" onclick="event.stopPropagation();removeSeller(\''+s.user_id+'\',\''+(s.nickname||'Seller')+'\')">✕</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('sellers-grid').innerHTML='<div class="sellers-grid">'+html+'</div>';
}

function selectSeller(sellerId){
  currentSellerId=sellerId;
  loaded={};
  destroyCharts();
  var seller=allSellers.find(function(s){return String(s.user_id)===String(sellerId);});
  document.getElementById('view-list').classList.remove('active');
  document.getElementById('view-detail').classList.add('active');
  document.getElementById('d-name').textContent=seller?(seller.nickname||'Seller'):'...';
  document.getElementById('d-id').textContent='ID: '+sellerId;

  // Reset tabs
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',i===0);});
  document.querySelectorAll('.tab-content').forEach(function(c,i){
    c.classList.toggle('active',i===0);
    c.innerHTML='<div class="loading-state"><div class="spinner"></div><span>Carregando...</span></div>';
  });
  activeTab='campanhas';
  loadTab('campanhas');
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active',b.textContent.toLowerCase().includes(tab==='campanhas'?'campa':tab==='reputacao'?'reputa':tab==='vendas'?'venda':'promo'));
  });
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  if(!loaded[tab]) loadTab(tab);
}

async function loadTab(tab){
  if(!currentSellerId) return;
  loaded[tab]=true;
  var dates=getPeriodDates();
  var el=document.getElementById('tab-'+tab);

  if(tab==='campanhas'){
    try{
      var ads=await fetch('/api/ads/'+currentSellerId+'?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.json();});
      var daily=await fetch('/api/ads/'+currentSellerId+'/daily?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
      renderCampanhas(el,ads,daily);
    }catch(e){el.innerHTML='<div class="loading-state"><span style="color:var(--red)">Erro ao carregar.</span></div>';}

  }else if(tab==='reputacao'){
    try{
      var rep=await fetch('/api/reputation/'+currentSellerId).then(function(r){return r.json();});
      renderReputacao(el,rep);
    }catch(e){el.innerHTML='<div class="loading-state"><span style="color:var(--red)">Erro ao carregar.</span></div>';}

  }else if(tab==='vendas'){
    try{
      var sales=await fetch('/api/sales/'+currentSellerId+'?date_from='+dates.date_from+'&date_to='+dates.date_to).then(function(r){return r.json();});
      renderVendas(el,sales);
    }catch(e){el.innerHTML='<div class="loading-state"><span style="color:var(--red)">Erro ao carregar.</span></div>';}

  }else if(tab==='promocoes'){
    try{
      var promos=await fetch('/api/promotions/'+currentSellerId).then(function(r){return r.json();});
      renderPromocoes(el,promos);
    }catch(e){el.innerHTML='<div class="loading-state"><span style="color:var(--red)">Erro ao carregar.</span></div>';}
  }
}

function renderCampanhas(el,ads,daily){
  var s=ads.summary;
  var camps=ads.campaigns||[];
  var acosColor=s.acos<=15?'var(--green)':s.acos<=25?'var(--amber)':'var(--red)';
  var roasColor=s.roas>=3?'var(--green)':'var(--red)';
  var ctr=s.impressions>0?((s.clicks/s.impressions)*100).toFixed(2):'0.00';
  var hasDailyData=daily&&daily.days&&daily.days.length>0;

  var campRows=camps.map(function(c){
    var acosC=c.acos<=15?'badge-green':c.acos<=25?'badge-amber':'badge-red';
    var dotColor=(c.status==='active'||c.status==='enabled')?'var(--green)':c.status==='paused'?'var(--amber)':'var(--red)';
    var stLabel=(c.status==='active'||c.status==='enabled')?'Ativa':c.status==='paused'?'Pausada':'Parada';
    var stBadge=(c.status==='active'||c.status==='enabled')?'badge-green':c.status==='paused'?'badge-amber':'badge-red';
    return '<tr>'+
      '<td><span class="dot" style="background:'+dotColor+'"></span><span class="cell-name" title="'+c.name+'">'+c.name+'</span></td>'+
      '<td>'+fmtDec(c.spend)+'</td><td>'+fmtDec(c.revenue)+'</td>'+
      '<td style="color:'+(c.roas>=3?'var(--green)':'var(--red)')+'">'+c.roas+'x</td>'+
      '<td><span class="badge '+acosC+'">'+c.acos+'%</span></td>'+
      '<td>'+fmtK(c.clicks)+'</td><td>'+fmtK(c.impressions)+'</td>'+
      '<td><span class="badge '+stBadge+'">'+stLabel+'</span></td>'+
    '</tr>';
  }).join('');
  var emptyCamps=camps.length===0?'<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:20px">Nenhuma campanha no período — ADS requer aprovação de parceiro ML</td></tr>':campRows;

  el.innerHTML=
    '<div class="section-label">Resumo do Período</div>'+
    '<div class="metrics-grid">'+
      '<div class="metric-card"><div class="metric-label">Gasto</div><div class="metric-value">'+fmt(s.spend)+'</div><div class="metric-delta">no período</div></div>'+

function renderReputacao(el,data){
  var rep=data.reputation||{};
  var ratings=rep.ratings||{};
  var posRate=Math.round((ratings.positive||0)*100);
  var neuRate=Math.round((ratings.neutral||0)*100);
  var negRate=Math.round((ratings.negative||0)*100);
  var levelInfo=repLevel(rep.level);
  var psInfo=powerSeller(rep.power_seller);
  var cancelRate=((rep.cancellations||0)*100).toFixed(1);
  var claimsRate=((rep.claims||0)*100).toFixed(1);
  var delayedRate=((rep.delayed||0)*100).toFixed(1);
  var cancelColor=(rep.cancellations||0)<=0.02?'var(--green)':'var(--red)';
  var claimsColor=(rep.claims||0)<=0.02?'var(--green)':'var(--red)';
  var delayedColor=(rep.delayed||0)<=0.05?'var(--green)':'var(--red)';

  el.innerHTML=
    '<div class="section-label">Visão Geral</div>'+
    '<div class="metrics-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">'+
      '<div class="metric-card"><div class="metric-label">Nível</div><div style="margin-top:8px"><span class="badge '+levelInfo[1]+'">'+levelInfo[0]+'</span></div></div>'+
      '<div class="metric-card"><div class="metric-label">Power Seller</div><div style="margin-top:8px"><span class="badge '+psInfo[1]+'">'+psInfo[0]+'</span></div></div>'+
      '<div class="metric-card"><div class="metric-label">Vendas Concluídas</div><div class="metric-value">'+fmtK(rep.sales_completed||0)+'</div><div class="metric-delta">histórico total</div></div>'+
    '</div>'+

    '<div class="two-col">'+
      '<div class="card">'+
        '<div class="card-title">Avaliações dos Compradores</div>'+
        '<div class="card-sub">Classificação das avaliações recebidas</div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">✅ Positivas</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+posRate+'%;background:var(--green)"></div></div><div class="rep-bar-val">'+posRate+'%</div></div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">😐 Neutras</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+neuRate+'%;background:var(--amber)"></div></div><div class="rep-bar-val">'+neuRate+'%</div></div>'+
        '<div class="rep-bar-wrap" style="margin-bottom:0"><div class="rep-bar-label">❌ Negativas</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+negRate+'%;background:var(--red)"></div></div><div class="rep-bar-val">'+negRate+'%</div></div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">Métricas Operacionais</div>'+
        '<div class="card-sub">Indicadores dos últimos 365 dias</div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">Cancelamentos</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.cancellations||0)*500,100)+'%;background:'+cancelColor+'"></div></div><div class="rep-bar-val" style="color:'+cancelColor+'">'+cancelRate+'%</div></div>'+
        '<div class="rep-bar-wrap"><div class="rep-bar-label">Reclamações</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.claims||0)*500,100)+'%;background:'+claimsColor+'"></div></div><div class="rep-bar-val" style="color:'+claimsColor+'">'+claimsRate+'%</div></div>'+
        '<div class="rep-bar-wrap" style="margin-bottom:0"><div class="rep-bar-label">Atrasos</div><div class="rep-bar-track"><div class="rep-bar-fill" style="width:'+Math.min((rep.delayed||0)*200,100)+'%;background:'+delayedColor+'"></div></div><div class="rep-bar-val" style="color:'+delayedColor+'">'+delayedRate+'%</div></div>'+
        '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)">Metas: cancelamentos ≤ 2% · reclamações ≤ 2% · atrasos ≤ 5%</div>'+
      '</div>'+
    '</div>';
}

function varBadge(v){
  if(v===0||v===null||v===undefined) return '<span style="font-size:11px;color:var(--text3)">—</span>';
  var color=v>=0?'var(--green)':'var(--red)';
  return '<span style="font-size:11px;color:'+color+'">'+(v>=0?'▲':'▼')+Math.abs(v)+'%</span>';
}

function promoTypeLabel(type){
  var map = {
    'LIGHTNING':              ['⚡ Oferta Relâmpago', 'badge-red'],
    'SMART':                  ['🧠 Smart',            'badge-blue'],
    'DEAL':                   ['🏷 Deal',              'badge-amber'],
    'SELLER_CAMPAIGN':        ['📣 Campanha',          'badge-green'],
    'SELLER_COUPON_CAMPAIGN': ['🎟 Cupom',             'badge-green'],
    'PRICE_DISCOUNT':         ['💲 Desconto',          'badge-amber'],
    'CROSS_SELLING':          ['🔗 Cross-selling',     'badge-blue'],
    'COMBINATION':            ['🎁 Combinação',        'badge-blue'],
  };
  var info = map[type] || [type||'—', 'badge-gray'];
  return '<span class="badge '+info[1]+'" style="font-size:10px">'+info[0]+'</span>';
}

function renderPromocoes(el,data){
  var promos=data.promotions||[];
  var total=data.total||0;

  // Agrupa por tipo para o resumo
  var byType = {};
  promos.forEach(function(p){
    var t = p.type||'OUTROS';
    byType[t] = (byType[t]||0) + 1;
  });

  var typeCards = Object.keys(byType).map(function(t){
    return '<div class="metric-card">'+
      '<div class="metric-label" style="margin-bottom:8px">'+promoTypeLabel(t)+'</div>'+
      '<div class="metric-value">'+byType[t]+'</div>'+
      '<div class="metric-delta">ativas</div>'+
    '</div>';
  }).join('');

  var promoRows=promos.map(function(p){
    var statusBadge=p.status==='started'||p.status==='active'?'badge-green':p.status==='paused'?'badge-amber':'badge-gray';
    var statusLabel=p.status==='started'||p.status==='active'?'Ativa':p.status==='paused'?'Pausada':'Encerrada';
    var inicio = p.start_date ? p.start_date.replace(/-/g,'/') : '—';
    var fim    = p.end_date   ? p.end_date.replace(/-/g,'/')   : '—';
    var duracao = '';
    if(p.start_date && p.end_date){
      var dias = Math.ceil((new Date(p.end_date) - new Date(p.start_date)) / (1000*60*60*24));
      duracao = '<div style="font-size:10px;color:var(--text3);margin-top:2px">'+dias+' dias</div>';
    }
    return '<tr>'+
      '<td>'+
        '<div style="font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+p.name+'">'+p.name+'</div>'+
        '<div style="margin-top:4px">'+promoTypeLabel(p.type)+'</div>'+
      '</td>'+
      '<td><span class="badge '+statusBadge+'">'+statusLabel+'</span></td>'+
      '<td>'+inicio+'</td>'+
      '<td>'+fim+duracao+'</td>'+
    '</tr>';
  }).join('');

  var emptyPromos=promos.length===0?
    '<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:32px">'+
      '<div style="font-size:32px;margin-bottom:12px;opacity:0.3">🎯</div>'+
      '<div style="font-size:14px;color:var(--text2)">Nenhuma promoção ativa encontrada</div>'+
    '</td></tr>':promoRows;

  el.innerHTML=
    '<div class="section-label">Resumo de Promoções</div>'+
    '<div class="metrics-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:24px">'+
      '<div class="metric-card">'+
        '<div class="metric-label">Total Ativas</div>'+
        '<div class="metric-value">'+total+'</div>'+
        '<div class="metric-delta">promoções no ar</div>'+
      '</div>'+
      typeCards+
    '</div>'+

    '<div class="section-label">Promoções Ativas</div>'+
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:16px 20px;border-bottom:1px solid var(--border)">'+
        '<div class="card-title">Central de Promoções</div>'+
        '<div class="card-sub" style="margin-bottom:0">'+total+' promoção(ões) ativa(s)</div>'+
      '</div>'+
      '<div style="overflow-x:auto">'+
        '<table class="data-table">'+
          '<thead><tr><th>Promoção / Tipo</th><th>Status</th><th>Início</th><th>Fim</th></tr></thead>'+
          '<tbody>'+emptyPromos+'</tbody>'+
        '</table>'+
      '</div>'+
    '</div>';
}

async function removeSeller(sellerId,name){
  if(!confirm('Remover '+name+' do dashboard?')) return;
  await fetch('/api/sellers/'+sellerId,{method:'DELETE'});
  allSellers=allSellers.filter(function(s){return String(s.user_id)!==String(sellerId);});
  loadList();
}
